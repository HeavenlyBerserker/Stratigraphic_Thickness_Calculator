<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f1f5f9" />
  <title>Stratigraphic Thickness Mobile</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      /* Light theme (default, field / outdoor readability) */
      --bg: #f1f5f9;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #16a34a;
      --warn: #b91c1c;
      --warn-bg: #fef2f2;
      --input: #ffffff;
      --border: #cbd5e1;
      --btn-secondary: #64748b;
      --icon-btn: #94a3b8;
      --link: #1d4ed8;
      --help-backdrop: rgba(15, 23, 42, 0.45);
    }
    html[data-theme="dark"] {
      --bg: #111827;
      --panel: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #22c55e;
      --warn: #f87171;
      --warn-bg: #292524;
      --input: #374151;
      --border: #4b5563;
      --btn-secondary: #4b5563;
      --icon-btn: #6b7280;
      --link: #93c5fd;
      --help-backdrop: rgba(0, 0, 0, 0.6);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 14px;
    }
    .card {
      background: var(--panel);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .header-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      column-gap: 10px;
    }
    .title-row-wrap {
      display: flex;
      justify-content: center;
      width: 100%;
      min-width: 0;
    }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .theme-toggle {
      width: auto;
      min-width: 2.5rem;
      padding: 6px 10px;
      font-size: 1.15rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex: 0 0 auto;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.2rem;
    }
    .muted { color: var(--muted); font-size: 0.9rem; }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.92rem;
    }
    input, select, button, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input);
      color: var(--text);
      padding: 10px;
      font-size: 16px;
    }
    .row {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .row.headings {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .model-diagram-slot {
      margin-top: 12px;
      display: none;
    }
    .model-diagram-frame {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      overflow: hidden;
    }
    .model-diagram-tab {
      display: block;
      width: 100%;
      margin: 0;
      padding: 11px 14px;
      border: none;
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0;
      background: linear-gradient(to bottom, #cbd5e1 0%, #e2e8f0 45%, #ffffff 100%);
      color: #475569;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.3;
      text-align: center;
      cursor: pointer;
    }
    .model-diagram-tab:hover {
      color: #1e293b;
      background: linear-gradient(to bottom, #94a3b8 0%, #cbd5e1 40%, #ffffff 100%);
    }
    .model-diagram-body {
      background: #ffffff;
    }
    .model-diagram-body img {
      display: block;
      width: 100%;
      height: auto;
    }
    .model-diagram-slot.is-collapsed .model-diagram-body {
      display: none;
    }
    .model-diagram-slot.is-collapsed .model-diagram-tab {
      border-bottom: none;
    }
    .cell-label { align-self: center; }
    .sigma-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sigma-prefix {
      color: var(--muted);
      min-width: 18px;
      text-align: right;
      font-size: 0.92rem;
    }
    .section-title { font-weight: bold; margin-top: 8px; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .icon-btn {
      width: auto;
      min-width: 26px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--icon-btn);
      font-weight: bold;
      line-height: 1.2;
    }
    .help-dialog {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      max-width: 640px;
      width: calc(100% - 32px);
      padding: 14px;
      max-height: min(85vh, 720px);
      overflow: hidden;
    }
    .help-dialog::backdrop {
      background: var(--help-backdrop);
    }
    .help-dialog a { color: var(--link); }
    .help-dialog-body {
      overflow-y: auto;
      max-height: min(70vh, 600px);
      margin-bottom: 12px;
      line-height: 1.4;
      font-size: 0.95rem;
    }
    .help-dialog-body h3 {
      margin: 0.75em 0 0.35em 0;
      font-size: 1.05rem;
    }
    .help-dialog-body h3:first-child { margin-top: 0; }
    .help-dialog-body ul { margin: 0.25em 0 0.5em 0; padding-left: 1.25em; }
    .help-dialog-body ol { margin: 0.25em 0 0.5em 0; padding-left: 1.35em; }
    .exports {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }
    #mcPlotKind {
      display: none;
      margin: 0;
    }
    button {
      background: #2563eb;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: var(--btn-secondary); }
    .geometry-warnings {
      border: 1px solid var(--warn);
      background: var(--warn-bg);
      color: var(--warn);
      padding: 8px 10px;
      margin: 0.4em 0 0.85em 0;
      border-radius: 6px;
    }
    .geometry-warnings b,
    .geometry-warnings span,
    .geometry-warnings ul {
      color: var(--warn);
    }
    #output.output-html {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.35;
      font-size: 0.95rem;
    }
    #output.output-html b { font-weight: 700; }
    #mcPlotAnchor {
      margin: 0.35em 0;
      max-width: 100%;
    }
    #mcPlotAnchor canvas#mcPlot {
      margin-top: 0;
    }
    .warn { color: var(--warn); }
    .view-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .view-tabs button.active {
      background: var(--accent);
      color: #fff;
    }
    .batch-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .batch-file-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 1.4fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .batch-format-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .batch-format-row label {
      margin: 0;
      white-space: nowrap;
    }
    #batchFileLabel,
    #batchOutputLabel {
      margin: 0;
      word-break: break-word;
    }
    #batchProgress {
      width: 100%;
      height: 18px;
      margin: 0;
      display: block;
    }
    .batch-status-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
    }
    #batchStatusIcon {
      min-width: 1.5rem;
      text-align: center;
      font-size: 1.25rem;
      line-height: 1;
    }
    #batchLog {
      min-height: 140px;
      max-height: 280px;
      overflow: auto;
      font-family: Consolas, monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input);
      color: var(--text);
      padding: 10px;
      margin-bottom: 0;
    }
    #batchLog .log-success { color: #15803d; }
    #batchLog .log-warning { color: #a16207; }
    #batchLog .log-error { color: #b91c1c; }
    html[data-theme="dark"] #batchLog .log-success { color: #4ade80; }
    html[data-theme="dark"] #batchLog .log-warning { color: #facc15; }
    html[data-theme="dark"] #batchLog .log-error { color: #f87171; }
    .hidden { display: none !important; }
    @media (max-width: 640px) {
      .row, .actions, .exports { grid-template-columns: 1fr; }
      .batch-actions,
      .batch-file-row,
      .batch-format-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header-bar">
        <div class="title-row-wrap">
          <div class="title-row">
            <img class="logo" src="../logo.png" alt="Stratigraphic Thickness Calculator logo" />
            <h1>Stratigraphic Thickness Calculator</h1>
          </div>
        </div>
        <button type="button" id="btnTheme" class="theme-toggle secondary" aria-label="Switch to dark theme" title="Use dark theme">&#x263E;</button>
      </div>
    </div>

    <div class="card">
      <div class="view-tabs">
        <button type="button" id="btnViewCalc" class="active">Calculator</button>
        <button type="button" id="btnViewBatch" class="secondary">Batch</button>
      </div>
    </div>

    <div id="calculatorView">
    <div class="card">
      <label for="model">Model</label>
      <select id="model"></select>
      <div id="fields" style="margin-top:10px;"></div>
      <div id="modelDiagramSlot" class="model-diagram-slot" aria-hidden="true">
        <div class="model-diagram-frame">
          <button type="button" id="btnToggleDiagram" class="model-diagram-tab" aria-expanded="true">
            Click to hide image
          </button>
          <div id="modelDiagramWrap" class="model-diagram-body">
            <img id="modelDiagram" alt="Model diagram" />
          </div>
        </div>
      </div>
      <div class="actions">
        <button id="btnCalc">Calculate</button>
        <button id="btnReset" class="secondary">Reset Defaults</button>
        <button id="btnHelp" class="secondary">Help &amp; Documentation</button>
      </div>
    </div>

    <div class="card">
      <label>Output</label>
      <div id="output" class="output-html">Ready.</div>
      <canvas id="mcPlot" style="display:none; width:100%; max-width:100%; margin-top:10px; background:#0b1220; border-radius:8px;"></canvas>
      <div class="exports">
        <select id="mcPlotKind" aria-label="Monte Carlo plot type">
          <option value="pdf" selected>PDF (histogram)</option>
          <option value="cdf">CDF (cumulative)</option>
        </select>
        <button id="btnXlsx" class="secondary">Save Results (.xlsx)</button>
        <button id="btnPng" class="secondary">Save MC Plot (PNG)</button>
        <button id="btnSvg" class="secondary">Save MC Plot (SVG)</button>
      </div>
    </div>
    </div>

    <div id="batchView" class="hidden">
      <div class="card">
        <h2 style="margin:0 0 8px 0; font-size:1.05rem;">Batch Processing</h2>
        <p class="muted" style="margin:0 0 10px 0;">
          Load an Excel workbook with one well per row. Column T selects the model (1–8).
          Value and σ columns follow the downloadable template.
        </p>
        <div class="batch-actions">
          <button type="button" id="btnBatchTemplate" class="secondary">Download Template (.xlsx)</button>
          <button type="button" id="btnBatchExample" class="secondary">Download Example (.xlsx)</button>
          <button type="button" id="btnBatchHelp" class="secondary">Help &amp; Documentation</button>
        </div>
        <div class="batch-format-row">
          <label for="batchPlotFormat">Monte Carlo plot format</label>
          <select id="batchPlotFormat">
            <option value="png" selected>PNG</option>
            <option value="svg">SVG</option>
          </select>
        </div>
        <div class="batch-file-row">
          <button type="button" id="btnBatchChoose" class="secondary">Choose File to Batch Process</button>
          <p id="batchFileLabel" class="muted">No batch file selected.</p>
        </div>
        <div class="batch-file-row">
          <button type="button" id="btnBatchRun">Batch Process</button>
          <p id="batchOutputLabel" class="muted">No output file selected.</p>
        </div>
        <input type="file" id="batchFileInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden" />
        <label for="batchLog">Batch log</label>
        <div id="batchLog" role="log" aria-live="polite"></div>
        <div class="batch-status-bar">
          <progress id="batchProgress" max="100" value="0"></progress>
          <span id="batchStatusIcon" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </div>
  <dialog id="helpDialog" class="help-dialog">
    <h3 style="margin:0 0 8px 0;">Help &amp; Documentation</h3>
    <div id="helpDialogBody" class="help-dialog-body"></div>
    <button id="btnCloseHelp" class="secondary">Close</button>
  </dialog>

  <script src="./app-info.js"></script>
  <script src="./batch-schema.js"></script>
  <script src="./batch.js"></script>
  <script src="./desktop-formula-where.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const defaults = {
      measured_thickness: 100,
      wellbore_inclination_deg: 20,
      wellbore_azimuth_deg: 120,
      formation_dip_deg: 15,
      dip_azimuth_deg: 140,
      formation_dip1_deg: 15,
      dip_azimuth1_deg: 140,
      formation_dip2_deg: 18,
      dip_azimuth2_deg: 150
    };

    const labels = {
      measured_thickness: "M (Measured Thickness)",
      wellbore_inclination_deg: "δ (Wellbore Inclination, deg)",
      wellbore_azimuth_deg: "φᵦ (Wellbore Azimuth, deg)",
      formation_dip_deg: "β (Formation Dip, deg)",
      dip_azimuth_deg: "φd (Dip Azimuth, deg)",
      formation_dip1_deg: "β₁ (Top Dip, deg)",
      dip_azimuth1_deg: "φd₁ (Top Dip Azimuth, deg)",
      formation_dip2_deg: "β₂ (Base Dip, deg)",
      dip_azimuth2_deg: "φd₂ (Base Dip Azimuth, deg)",
    };

    const modelSpecs = {
      t1: {
        label: "One-dip (T₁)",
        exportBasename: "One-dip (T₁)",
        xlsxInputColumns: [
          ["measured_thickness", "M"],
          ["wellbore_inclination_deg", "delta_deg"],
          ["formation_dip_deg", "beta1_deg"],
          ["wellbore_azimuth_deg", "phib_deg"],
          ["dip_azimuth_deg", "phid1_deg"],
        ],
        fields: ["measured_thickness", "wellbore_inclination_deg", "formation_dip_deg", "wellbore_azimuth_deg", "dip_azimuth_deg"],
        wrap_fields: ["wellbore_azimuth_deg", "dip_azimuth_deg"],
      },
      t2: {
        label: "Average-vector (T₂)",
        exportBasename: "Average-vector (T₂)",
        xlsxInputColumns: [
          ["measured_thickness", "M"],
          ["wellbore_inclination_deg", "delta_deg"],
          ["wellbore_azimuth_deg", "phib_deg"],
          ["formation_dip1_deg", "beta1_deg"],
          ["dip_azimuth1_deg", "phid1_deg"],
          ["formation_dip2_deg", "beta2_deg"],
          ["dip_azimuth2_deg", "phid2_deg"],
        ],
        fields: ["measured_thickness", "wellbore_inclination_deg", "wellbore_azimuth_deg", "formation_dip1_deg", "dip_azimuth1_deg", "formation_dip2_deg", "dip_azimuth2_deg"],
        wrap_fields: ["wellbore_azimuth_deg", "dip_azimuth1_deg", "dip_azimuth2_deg"],
      },
      t3: {
        label: "Average-thickness (T₃)",
        exportBasename: "Average-thickness (T₃)",
        xlsxInputColumns: [
          ["measured_thickness", "M"],
          ["wellbore_inclination_deg", "delta_deg"],
          ["wellbore_azimuth_deg", "phib_deg"],
          ["formation_dip1_deg", "beta1_deg"],
          ["dip_azimuth1_deg", "phid1_deg"],
          ["formation_dip2_deg", "beta2_deg"],
          ["dip_azimuth2_deg", "phid2_deg"],
        ],
        fields: ["measured_thickness", "wellbore_inclination_deg", "wellbore_azimuth_deg", "formation_dip1_deg", "dip_azimuth1_deg", "formation_dip2_deg", "dip_azimuth2_deg"],
        wrap_fields: ["wellbore_azimuth_deg", "dip_azimuth1_deg", "dip_azimuth2_deg"],
      },
      t4: {
        label: "Mixed Average (T₄)",
        exportBasename: "Mixed Average (T₄)",
        xlsxInputColumns: [
          ["measured_thickness", "M"],
          ["wellbore_inclination_deg", "delta_deg"],
          ["wellbore_azimuth_deg", "phib_deg"],
          ["formation_dip1_deg", "beta1_deg"],
          ["dip_azimuth1_deg", "phid1_deg"],
          ["formation_dip2_deg", "beta2_deg"],
          ["dip_azimuth2_deg", "phid2_deg"],
        ],
        fields: ["measured_thickness", "wellbore_inclination_deg", "wellbore_azimuth_deg", "formation_dip1_deg", "dip_azimuth1_deg", "formation_dip2_deg", "dip_azimuth2_deg"],
        wrap_fields: ["wellbore_azimuth_deg", "dip_azimuth1_deg", "dip_azimuth2_deg"],
      },
      t5: {
        label: "Concentric Fold (T₅)",
        exportBasename: "Concentric Fold (T₅)",
        xlsxInputColumns: [
          ["measured_thickness", "M"],
          ["wellbore_inclination_deg", "delta_deg"],
          ["wellbore_azimuth_deg", "phib_deg"],
          ["formation_dip1_deg", "beta1_deg"],
          ["dip_azimuth1_deg", "phid1_deg"],
          ["formation_dip2_deg", "beta2_deg"],
          ["dip_azimuth2_deg", "phid2_deg"],
        ],
        fields: ["measured_thickness", "wellbore_inclination_deg", "wellbore_azimuth_deg", "formation_dip1_deg", "dip_azimuth1_deg", "formation_dip2_deg", "dip_azimuth2_deg"],
        wrap_fields: ["wellbore_azimuth_deg", "dip_azimuth1_deg", "dip_azimuth2_deg"],
      },
      t6: {
        label: "Plunging Concentric Fold (T₆)",
        exportBasename: "Plunging Concentric Fold (T₆)",
        xlsxInputColumns: [
          ["measured_thickness", "M"],
          ["wellbore_inclination_deg", "delta_deg"],
          ["wellbore_azimuth_deg", "phib_deg"],
          ["formation_dip1_deg", "beta1_deg"],
          ["dip_azimuth1_deg", "phid1_deg"],
          ["formation_dip2_deg", "beta2_deg"],
          ["dip_azimuth2_deg", "phid2_deg"],
        ],
        fields: ["measured_thickness", "wellbore_inclination_deg", "wellbore_azimuth_deg", "formation_dip1_deg", "dip_azimuth1_deg", "formation_dip2_deg", "dip_azimuth2_deg"],
        wrap_fields: ["wellbore_azimuth_deg", "dip_azimuth1_deg", "dip_azimuth2_deg"],
      },
      t7: {
        label: "Top-normal (T₇)",
        exportBasename: "Top-normal (T₇)",
        xlsxInputColumns: [
          ["measured_thickness", "M"],
          ["wellbore_inclination_deg", "delta_deg"],
          ["wellbore_azimuth_deg", "phib_deg"],
          ["formation_dip1_deg", "beta1_deg"],
          ["dip_azimuth1_deg", "phid1_deg"],
          ["formation_dip2_deg", "beta2_deg"],
          ["dip_azimuth2_deg", "phid2_deg"],
        ],
        fields: ["measured_thickness", "wellbore_inclination_deg", "wellbore_azimuth_deg", "formation_dip1_deg", "dip_azimuth1_deg", "formation_dip2_deg", "dip_azimuth2_deg"],
        wrap_fields: ["wellbore_azimuth_deg", "dip_azimuth1_deg", "dip_azimuth2_deg"],
      },
      t8: {
        label: "Equal-angle (T₈)",
        exportBasename: "Equal-angle (T₈)",
        xlsxInputColumns: [
          ["measured_thickness", "M"],
          ["wellbore_inclination_deg", "delta_deg"],
          ["wellbore_azimuth_deg", "phib_deg"],
          ["formation_dip1_deg", "beta1_deg"],
          ["dip_azimuth1_deg", "phid1_deg"],
          ["formation_dip2_deg", "beta2_deg"],
          ["dip_azimuth2_deg", "phid2_deg"],
        ],
        fields: ["measured_thickness", "wellbore_inclination_deg", "wellbore_azimuth_deg", "formation_dip1_deg", "dip_azimuth1_deg", "formation_dip2_deg", "dip_azimuth2_deg"],
        wrap_fields: ["wellbore_azimuth_deg", "dip_azimuth1_deg", "dip_azimuth2_deg"],
      },
    };

    const diagramBasenames = {
      t1: "Fig_T1",
      t2: "Fig_T2",
      t3: "Fig_T3",
      t4: "Fig_T4",
      t5: "Fig_T5",
      t6: "Fig_T6",
      t7: "Fig_T7",
      t8: "Fig_T8",
    };

    const modelSelect = document.getElementById("model");
    const fieldsRoot = document.getElementById("fields");
    const modelDiagramSlot = document.getElementById("modelDiagramSlot");
    const modelDiagramWrap = document.getElementById("modelDiagramWrap");
    const modelDiagram = document.getElementById("modelDiagram");
    const btnToggleDiagram = document.getElementById("btnToggleDiagram");
    const DIAGRAM_HIDDEN_KEY = "stc-diagram-hidden";
    let diagramAvailable = false;

    function isDiagramCollapsed() {
      return localStorage.getItem(DIAGRAM_HIDDEN_KEY) === "1";
    }

    function applyDiagramCollapsedState() {
      if (!modelDiagramSlot) return;
      const collapsed = isDiagramCollapsed();
      modelDiagramSlot.classList.toggle("is-collapsed", collapsed);
      if (btnToggleDiagram) {
        btnToggleDiagram.textContent = collapsed ? "Show image" : "Click to hide image";
        btnToggleDiagram.setAttribute("aria-expanded", collapsed ? "false" : "true");
      }
    }

    function setDiagramSlotVisible(visible) {
      diagramAvailable = !!visible;
      if (!modelDiagramSlot) return;
      if (!visible) {

    function initThemeToggle() {
      const btnTheme = document.getElementById("btnTheme");
      if (!btnTheme) return;
      const root = document.documentElement;
      const metaTheme = document.querySelector('meta[name="theme-color"]');

      function isDark() {
        return root.getAttribute("data-theme") === "dark";
      }

      function applyTheme(mode) {
        if (mode === "dark") {
          root.setAttribute("data-theme", "dark");
        } else {
          root.removeAttribute("data-theme");
        }
        if (metaTheme) {
          metaTheme.setAttribute("content", mode === "dark" ? "#111827" : "#f1f5f9");
        }
        // Moon in light mode → dark; sun in dark → light. U+263C (☼) reads clearer than U+2600 on web fonts.
        btnTheme.textContent = mode === "dark" ? "\u263c" : "\u263e";
        btnTheme.setAttribute(
          "aria-label",
          mode === "dark" ? "Switch to light theme" : "Switch to dark theme"
        );
        btnTheme.setAttribute(
          "title",
          mode === "dark" ? "Use light theme" : "Use dark theme"
        );
      }

      let stored = localStorage.getItem(THEME_STORAGE_KEY);
      if (stored !== "dark" && stored !== "light") {
        stored = "light";
      }
      applyTheme(stored);

      btnTheme.addEventListener("click", () => {
        const next = isDark() ? "light" : "dark";
        localStorage.setItem(THEME_STORAGE_KEY, next);
        applyTheme(next);
      });
    }

    function drawMcPlot(values, plotKind) {
      if (!Array.isArray(values) || values.length < 2) {
        mcPlot.style.display = "none";
        return;
      }
      const kind = (plotKind || "pdf").toLowerCase();
      const dpr = window.devicePixelRatio || 1;
      const cssW = mcPlot.clientWidth || 600;
      const cssH = 280;
      mcPlot.width = Math.floor(cssW * dpr);
      mcPlot.height = Math.floor(cssH * dpr);
      mcPlot.style.height = cssH + "px";
      const ctx = mcPlot.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, cssW, cssH);
      const margin = { top: 34, right: 18, bottom: 52, left: 58 };
      const plotW = cssW - margin.left - margin.right;
      const plotH = cssH - margin.top - margin.bottom;
      const sorted = values.slice().sort((a, b) => a - b);
      const min = sorted[0];
      const max = sorted[sorted.length - 1];
      const width = max - min || 1;

      ctx.fillStyle = "#0b1220";
      ctx.fillRect(margin.left, margin.top, plotW, plotH);

      let yLabel = "Frequency (%)";
      let title = "Monte Carlo Thickness Distribution (PDF)";
      let maxPct = 100;

      if (kind === "cdf") {
        title = "Monte Carlo Thickness Distribution (CDF)";
        yLabel = "Cumulative (%)";
        ctx.strokeStyle = "#4C78A8";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < sorted.length; i++) {
          const x = margin.left + ((sorted[i] - min) / width) * plotW;
          const y = margin.top + plotH - ((i + 1) / sorted.length) * plotH;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      } else {
        const bins = 40;
        const counts = new Array(bins).fill(0);
        for (const v of values) {
          let i = Math.floor(((v - min) / width) * bins);
          if (i < 0) i = 0;
          if (i >= bins) i = bins - 1;
          counts[i] += 1;
        }
        const maxC = Math.max(...counts);
        const pctPerCount = 100.0 / values.length;
        maxPct = maxC * pctPerCount;
        ctx.fillStyle = "#4C78A8";
        for (let i = 0; i < bins; i++) {
          const barW = plotW / bins;
          const h = maxC ? (counts[i] / maxC) * plotH : 0;
          const x = margin.left + i * barW;
          const y = margin.top + (plotH - h);
          ctx.fillRect(x + 1, y, Math.max(1, barW - 2), h);
        }
      }

      ctx.strokeStyle = "#9ca3af";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(margin.left, margin.top);
      ctx.lineTo(margin.left, margin.top + plotH);
      ctx.lineTo(margin.left + plotW, margin.top + plotH);
      ctx.stroke();

      ctx.fillStyle = "#d1d5db";
      ctx.font = "12px Arial";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      const yTicks = 5;
      for (let i = 0; i <= yTicks; i++) {
        const t = i / yTicks;
        const y = margin.top + plotH - t * plotH;
        const val = (t * maxPct).toFixed(1);
        ctx.strokeStyle = "#334155";
        ctx.beginPath();
        ctx.moveTo(margin.left, y);
        ctx.lineTo(margin.left + plotW, y);
        ctx.stroke();
        ctx.fillStyle = "#d1d5db";
        ctx.fillText(val, margin.left - 8, y);
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const xTicks = 4;
      for (let i = 0; i <= xTicks; i++) {
        const t = i / xTicks;
        const x = margin.left + t * plotW;
        const val = (min + t * width).toFixed(3);
        ctx.strokeStyle = "#334155";
        ctx.beginPath();
        ctx.moveTo(x, margin.top + plotH);
        ctx.lineTo(x, margin.top + plotH + 6);
        ctx.stroke();
        ctx.fillStyle = "#d1d5db";
        ctx.fillText(val, x, margin.top + plotH + 8);
      }

      ctx.fillStyle = "#f3f4f6";
      ctx.font = "bold 13px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText("Thickness", margin.left + plotW / 2, cssH - 20);

      ctx.save();
      ctx.translate(16, margin.top + plotH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText(yLabel, 0, 0);
      ctx.restore();

      ctx.font = "bold 14px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText(title, margin.left + plotW / 2, 10);
      mcPlot.style.display = "block";
    }

    function downloadBlob(blob, filename) {
      const a = document.createElement("a");
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

        [`${prefix}_z`, Number(v[2])],

    /** Bold one cell (0-based row/col). Requires xlsx-js-style for .s to persist. */
    function xlsxSetCellBold(ws, r, c) {
      const addr = XLSX.utils.encode_cell({ r, c });
      if (!ws[addr]) return;
      ws[addr].s = { font: { bold: true } };
    }

    /**
     * Match desktop ModelTab._write_results_xlsx: bold Model row, section titles,
     * and Field/Value(/Sigma) header rows only (not data rows).
     */
    function applyDesktopResultsSheetBold(ws, nInputs, nOutputs, hasMc) {
      xlsxSetCellBold(ws, 0, 0);
      xlsxSetCellBold(ws, 0, 1);
      xlsxSetCellBold(ws, 2, 0);
      xlsxSetCellBold(ws, 3, 0);
      xlsxSetCellBold(ws, 3, 1);
      xlsxSetCellBold(ws, 3, 2);
      const outputsTitleRow = 4 + nInputs + 1;
      const outputsHeaderRow = outputsTitleRow + 1;
      xlsxSetCellBold(ws, outputsTitleRow, 0);
      xlsxSetCellBold(ws, outputsHeaderRow, 0);
      xlsxSetCellBold(ws, outputsHeaderRow, 1);
      if (hasMc) {
        const mcTitleRow = outputsHeaderRow + nOutputs + 2;
        const mcHeaderRow = mcTitleRow + 1;
        xlsxSetCellBold(ws, mcTitleRow, 0);
        xlsxSetCellBold(ws, mcHeaderRow, 0);
        xlsxSetCellBold(ws, mcHeaderRow, 1);
      }
    }

    function exportXlsx() {
      if (!lastPayload || !lastSpec || !lastModelId) {
        detachMcPlotCanvas();
        output.classList.add("warn");
        output.textContent = "Run Calculate first, then export.";
        attachMcPlotBeforeExports();
        return;
      }
      const xspec = modelSpecs[lastModelId];
      if (!xspec || !Array.isArray(xspec.xlsxInputColumns)) {
        detachMcPlotCanvas();
        output.classList.add("warn");
        output.textContent = "Missing model export layout; recalculate and try again.";
        attachMcPlotBeforeExports();
        return;
      }
      const inputs = lastPayload.inputs;
      const stds = lastPayload.stds || {};
      const outRows = buildXlsxOutputRows(lastModelId, lastPayload.result);
      const mcRows = buildXlsxMcRows(lastPayload.monte_carlo);

      const rows = [];
      rows.push(["Model", xspec.exportBasename]);
      rows.push([]);
      rows.push(["Inputs"]);
      rows.push(["Field", "Value", "Sigma"]);
      for (const [fieldKey, colName] of xspec.xlsxInputColumns) {
        rows.push([colName, Number(inputs[fieldKey]), Number(stds[fieldKey] ?? 0)]);
      }
      rows.push([]);
      rows.push(["Outputs"]);
      rows.push(["Field", "Value"]);
      for (const pair of outRows) {
        rows.push(pair);
      }
      if (mcRows && mcRows.length) {
        rows.push([]);
        rows.push(["Monte Carlo"]);
        rows.push(["Field", "Value"]);
        for (const pair of mcRows) {
          rows.push(pair);
        }
      }

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(rows);
      applyDesktopResultsSheetBold(
        ws,
        xspec.xlsxInputColumns.length,
        outRows.length,
        !!(mcRows && mcRows.length)
      );
      XLSX.utils.book_append_sheet(wb, ws, "Results");
      XLSX.writeFile(wb, `${xspec.exportBasename}.xlsx`);
    }

    async function initPyodideRuntime() {
      if (runtimeReady) return;
      btnCalc.disabled = true;
      btnCalc.textContent = "Initializing...";
      pyodide = await loadPyodide();
      const modelSource = await (await fetch("../source/models.py")).text();
      pyodide.FS.mkdir("/source");
      pyodide.FS.writeFile("/source/__init__.py", "");
      pyodide.FS.writeFile("/source/models.py", modelSource);
      await pyodide.runPythonAsync(`
import json, random
import sys, types
from dataclasses import asdict
from statistics import mean, pstdev

source_pkg = types.ModuleType("source")
source_pkg.__path__ = []  # mark as package
sys.modules["source"] = source_pkg
models_mod = types.ModuleType("source.models")
models_mod.__name__ = "source.models"
models_mod.__package__ = "source"
sys.modules["source.models"] = models_mod
with open("/source/models.py", "r", encoding="utf-8") as f:
    exec(compile(f.read(), "/source/models.py", "exec"), models_mod.__dict__)
_ns = models_mod.__dict__

OneDipInputs = _ns["OneDipInputs"]
AverageVectorInputs = _ns["AverageVectorInputs"]
AverageThicknessInputs = _ns["AverageThicknessInputs"]
MixedAverageInputs = _ns["MixedAverageInputs"]
ConcentricFoldInputs = _ns["ConcentricFoldInputs"]
PlungingConcentricFoldInputs = _ns["PlungingConcentricFoldInputs"]
TopNormalInputs = _ns["TopNormalInputs"]
EqualAngleInputs = _ns["EqualAngleInputs"]
compute_one_dip = _ns["compute_one_dip"]
compute_average_vector = _ns["compute_average_vector"]
compute_average_thickness = _ns["compute_average_thickness"]
compute_mixed_average = _ns["compute_mixed_average"]
compute_concentric_fold = _ns["compute_concentric_fold"]
compute_plunging_concentric_fold = _ns["compute_plunging_concentric_fold"]
compute_top_normal = _ns["compute_top_normal"]
compute_equal_angle = _ns["compute_equal_angle"]

_MAP = {
    "t1": (OneDipInputs, compute_one_dip),
    "t2": (AverageVectorInputs, compute_average_vector),
    "t3": (AverageThicknessInputs, compute_average_thickness),
    "t4": (MixedAverageInputs, compute_mixed_average),
    "t5": (ConcentricFoldInputs, compute_concentric_fold),
    "t6": (PlungingConcentricFoldInputs, compute_plunging_concentric_fold),
    "t7": (TopNormalInputs, compute_top_normal),
    "t8": (EqualAngleInputs, compute_equal_angle),
}

def _pct(vals, p):
    sv = sorted(vals)
    if len(sv) == 1: return sv[0]
    i = (len(sv)-1)*p
    lo = int(i); hi = min(lo+1, len(sv)-1); f = i-lo
    return sv[lo]*(1-f)+sv[hi]*f

def _bounds(name):
    if "azimuth" in name: return (0.0, 360.0)
    if "inclination" in name: return (0.0, 180.0)
    if "dip" in name: return (0.0, 90.0)
    return (-1e9, 1e9)

def _sample(mu, sigma, lo, hi, wrap):
    if sigma <= 0.0: return mu
    raw = random.gauss(mu, sigma)
    if wrap:
        w = hi - lo
        return ((raw - lo) % w) + lo
    return min(max(raw, lo), hi)

_VEC_PREFIX = {
    "ud1": "Ud1", "ud2": "Ud2", "ud2_prime": "Ud2_prime", "uav": "Uav",
    "ub": "Ub", "ndc": "Ndc", "ndp": "Ndp", "c": "Uc", "ub_prime": "Ub_prime",
}

def format_intermediate_values(model_id, result):
    data = asdict(result)
    warnings = data.pop("geometry_warnings", ()) or ()
    lines = [f"{model_id.upper()}={result.true_stratigraphic_thickness:.6f}"]
    skip = {"true_stratigraphic_thickness", "geometry_warnings"}
    for key, value in data.items():
        if key in skip:
            continue
        if key.endswith("_vector") and isinstance(value, (list, tuple)) and len(value) == 3:
            prefix = _VEC_PREFIX.get(key.replace("_vector", ""), key.replace("_vector", ""))
            lines.append(f"{prefix}_x={float(value[0]):.6f}")
            lines.append(f"{prefix}_y={float(value[1]):.6f}")
            lines.append(f"{prefix}_z={float(value[2]):.6f}")
        elif isinstance(value, bool):
            lines.append(f"{key}={int(value)}")
        elif isinstance(value, (int, float)):
            lines.append(f"{key}={float(value):.6f}")
    if warnings:
        lines.append("geometry_warnings=" + "; ".join(str(w) for w in warnings))
    return "; ".join(lines)

def compute_payload(model_id, values, stds, wrap_fields, sample_count=2500):
    C, fn = _MAP[model_id]
    vals = {k: float(v) for k, v in values.items()}
    sds = {k: max(0.0, float(stds.get(k, 0.0))) for k in vals.keys()}
    result = fn(C(**vals))
    mc = None
    if any(s > 1e-12 for s in sds.values()):
        ts = []
        keys = list(vals.keys())
        wrap = set(wrap_fields)
        for _ in range(sample_count):
            cur = {}
            for k in keys:
                lo, hi = _bounds(k)
                cur[k] = _sample(vals[k], sds[k], lo, hi, k in wrap)
            r = fn(C(**cur))
            ts.append(float(r.true_stratigraphic_thickness))
        mc = {
            "n": float(sample_count),
            "mean": mean(ts),
            "std": pstdev(ts),
            "p10": _pct(ts, 0.10),
            "p25": _pct(ts, 0.25),
            "p50": _pct(ts, 0.50),
            "p75": _pct(ts, 0.75),
            "p90": _pct(ts, 0.90),
            "thicknesses": ts,
        }
    return json.dumps({
        "result": asdict(result),
        "inputs": vals,
        "stds": sds,
        "monte_carlo": mc,
        "intermediate_values": format_intermediate_values(model_id, result),
    })
      `);
      runtimeReady = true;
      btnCalc.disabled = false;
      btnCalc.textContent = "Calculate";

      appendBatchLog("Downloaded batch_example.xlsx (8 deterministic + 8 Monte Carlo rows).");
    });

    btnBatchChoose.addEventListener("click", () => batchFileInput.click());

    batchFileInput.addEventListener("change", async () => {
      const file = batchFileInput.files && batchFileInput.files[0];
      if (!file) return;
      batchFileName = file.name;
      batchFileBuffer = await file.arrayBuffer();
      batchFileLabel.textContent = batchFileName;
      appendBatchLog(`Selected batch file: ${batchFileName}`);
    });

    btnBatchHelp.addEventListener("click", () => {
      if (helpDialogBody && typeof helpDocumentationHtml === "function") {
        helpDialogBody.innerHTML = helpDocumentationHtml("batch_web");
      }
      if (typeof helpDialog.showModal === "function") {
        helpDialog.showModal();
      } else if (typeof helpDocumentationPlain === "function") {
        alert(helpDocumentationPlain("batch_web"));
      }
    });

    btnBatchRun.addEventListener("click", async () => {
      if (!batchFileBuffer) {
        appendBatchLog("Choose a batch input workbook first.", "error");
        setBatchStatusIcon("❌");
        return;
      }
      try {
        btnBatchRun.disabled = true;
        btnBatchChoose.disabled = true;
        btnBatchTemplate.disabled = true;
        btnBatchExample.disabled = true;
        batchPlotFormat.disabled = true;
        batchProgress.value = 0;
        setBatchStatusIcon("");
        const plotFormat = batchPlotFormat.value || "png";
        batchOutputName = "batch_results.xlsx";
        batchOutputLabel.textContent = batchOutputName;
        appendBatchLog(`Starting batch: ${batchFileName || "input.xlsx"}`);
        appendBatchLog(`Output: ${batchOutputName} (browser download)`);
        appendBatchLog(`Monte Carlo plot format: ${plotFormat.toUpperCase()}`);
        if (!runtimeReady) {
          appendBatchLog("Initializing calculation runtime...");
          await initPyodideRuntime();
        }
        const rows = STCBatch.readWorkbookRows(batchFileBuffer);
        const results = await STCBatch.runBatch(pyodide, rows, (current, total, message) => {
          batchProgress.value = Math.round((100 * current) / Math.max(total, 1));
          appendBatchLog(message);
        });
        const errors = results.filter((r) => r.status !== "OK");
        const warned = results.filter((r) => r.status === "OK" && r.warnings && r.warnings.length);
        for (const result of errors) {
          appendBatchLog(`${result.well_id}: ${result.error}`, "error");
        }
        for (const result of warned) {
          for (const warning of result.warnings) {
            appendBatchLog(`${result.well_id}: ${warning}`, "warning");
          }
        }
        STCBatch.downloadWorkbook(STCBatch.writeResultsWorkbook(results), batchOutputName);
        const zipBlob = await STCBatch.buildMcPlotsZip(results, plotFormat);
        let plotsNote = "";
        if (zipBlob) {
          const zipName = "batch_results_mc_plots.zip";
          downloadBlob(zipBlob, zipName);
          plotsNote = `\nMonte Carlo plots: ${zipName}`;
          appendBatchLog(`Saved ${zipName} (${plotFormat.toUpperCase()} PDF/CDF plots for Monte Carlo wells).`);
        }
        const okCount = results.length - errors.length;
        if (errors.length) {
          appendBatchLog(
            `Batch finished with ${errors.length} error(s), ${okCount} OK. Results: ${batchOutputName}${plotsNote}`,
            "error"
          );
          setBatchStatusIcon("❌");
        } else if (warned.length) {
          appendBatchLog(
            `Success with ${warned.length} warning(s). Processed ${results.length} row(s). Results: ${batchOutputName}${plotsNote}`,
            "warning"
          );
          setBatchStatusIcon("⚠️");
        } else {
          appendBatchLog(
            `Success. Processed ${results.length} row(s). Results: ${batchOutputName}${plotsNote}`,
            "success"
          );
          setBatchStatusIcon("✅");
        }
        batchProgress.value = 100;
      } catch (err) {
        appendBatchLog("Batch failed: " + err.message, "error");
        setBatchStatusIcon("❌");
      } finally {
        btnBatchRun.disabled = false;
        btnBatchChoose.disabled = false;
        btnBatchTemplate.disabled = false;
        btnBatchExample.disabled = false;
        batchPlotFormat.disabled = false;
      }
    });

    (async () => {
      try {
        loadModels();
        await initPyodideRuntime();
      } catch (err) {
        runtimeReady = false;
        btnCalc.disabled = false;
        btnCalc.textContent = "Calculate";
        detachMcPlotCanvas();
        output.classList.add("warn");
        output.textContent = "Failed to initialize app:\n" + err.message;
        attachMcPlotBeforeExports();
        lastPayload = null;
        lastSpec = null;
        lastModelId = null;
        mcPlot.style.display = "none";
        updateExportVisibility();
      }
    })();
  </script>
</body>
</html>
